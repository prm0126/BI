[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-forecast"
version = "0.1.0"
description = "Healthcare-operations forecasting engine with a model router, explanations, and improvement recommendations."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "click>=8.1",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0"]
prophet = ["prophet>=1.1"]
shap = ["shap>=0.44"]
llm = ["anthropic>=0.40"]
all = ["xgboost>=2.0", "prophet>=1.1", "shap>=0.44", "anthropic>=0.40"]

[project.scripts]
bi-forecast = "bi_forecast.cli:cli"

[tool.setuptools.packages.find]
include = ["bi_forecast*"]
