[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-forecast"
version = "0.1.0"
description = "Healthcare-operations forecasting engine with a model router, explanations, and improvement recommendations."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "click>=8.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0"]
prophet = ["prophet>=1.1"]
shap = ["shap>=0.44"]
llm = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
oracle = ["oracledb>=2.0", "PyYAML>=6.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "python-multipart>=0.0.9", "httpx>=0.27"]
dashboard = ["streamlit>=1.30"]
video = ["pillow>=10.0", "imageio-ffmpeg>=0.5", "playwright>=1.40"]
test = ["pytest>=7.4", "httpx>=0.27"]
all = [
    "xgboost>=2.0",
    "prophet>=1.1",
    "shap>=0.44",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "streamlit>=1.30",
    "pytest>=7.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "playwright>=1.40",
]

[project.scripts]
bi-forecast = "bi_forecast.cli:cli"
bi-forecast-api = "bi_forecast.api.app:app"

[tool.setuptools.packages.find]
include = ["bi_forecast*"]
